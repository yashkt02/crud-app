server.port=${PORT:8081}
spring.application.name=auth-service
spring.datasource.url=${AUTH_DB_URL:jdbc:h2:file:./data/expense_auth;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AUTH_DB_USERNAME:sa}
spring.datasource.password=${AUTH_DB_PASSWORD:demo-db-password}
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false
spring.security.oauth2.resourceserver.jwt.secret=${JWT_SECRET}
app.admin.username=${ADMIN_USERNAME:admin}
app.demo.password=${DEMO_PASSWORD:DemoOnly123!}
app.admin.password=${ADMIN_PASSWORD}
app.demo.users=${DEMO_USERS:}
app.jwt.issuer=${JWT_ISSUER:expense-auth-service}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.cors.allowed-origin=${APP_ORIGIN:http://localhost:8080}
