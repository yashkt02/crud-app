server.port=${PORT:8080}
spring.application.name=expense-service
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.security.oauth2.resourceserver.jwt.secret=${JWT_SECRET}
app.auth-service.url=${AUTH_SERVICE_URL:http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}}
app.summary-service.url=${SUMMARY_SERVICE_URL:http://${SUMMARY_SERVICE_HOST:localhost}:${SUMMARY_SERVICE_PORT:8082}}