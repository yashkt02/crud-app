server.port=${PORT:8082}
spring.application.name=summary-service
spring.datasource.url=${SUMMARY_DB_URL:jdbc:mysql://${SUMMARY_DB_HOST:localhost}:${SUMMARY_DB_PORT:3306}/${SUMMARY_DB_NAME:expense_tracker}?createDatabaseIfNotExist=true}
spring.datasource.username=${SUMMARY_DB_USERNAME:root}
spring.datasource.password=${SUMMARY_DB_PASSWORD:}
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=expense-summary-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.summary.ExpenseEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.summary
spring.security.oauth2.resourceserver.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${APP_ORIGIN:http://localhost:8080}
app.auth-service.url=${AUTH_SERVICE_URL:http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}}